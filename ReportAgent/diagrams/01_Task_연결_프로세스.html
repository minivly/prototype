<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task → 일정 에이전트 → 보고회의 Agent 연결 프로세스</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root{
    --paper:#F7F6F3; --card:#FFFFFF; --ink:#1D1B17; --ink-soft:#6B665C;
    --ink-faint:#948E82; --line:#DAD5CB; --accent:#C2540C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);}
  .wrap{max-width:1220px;margin:0 auto;padding:40px 24px 56px;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;}
  h1{font-size:1.3rem;font-weight:800;margin:0 0 8px;letter-spacing:-.01em;}
  .lede{color:var(--ink-soft);font-size:.88rem;line-height:1.6;max-width:74ch;margin:0 0 28px;}
  figure{margin:0;}
  svg{width:100%;height:auto;display:block;}
  figcaption{margin-top:14px;font-size:.8rem;color:var(--ink-faint);line-height:1.6;}
  .legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:.76rem;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:7px;}
  .sw{width:18px;height:0;border-top:2px solid var(--ink-faint);display:inline-block;}
  .sw.dash{border-top-style:dashed;}
  .sw.acc{border-top-color:var(--accent);}
  .sw.dot{border:none;width:8px;height:8px;border-radius:50%;background:var(--ink-faint);}
</style>
</head>
<body>

<div class="wrap">
  <h1>Task 관리 → 일정 에이전트 → 보고회의 Agent, 연결 프로세스</h1>
  <p class="lede">Task 생성부터 미팅 준비·진행·사후관리를 거쳐 회장님이 텔레그램에서 브리핑을 받고 질의응답하기까지, 세 시스템을 오가는 흐름입니다. 상단 3개 레인은 각 시스템(보고회의 Agent · 일정 에이전트 · 텔레그램)을 나타내고, 주황 화살표는 미팅·자료가 추가로 필요할 때 되돌아가는 반복 루프입니다.</p>

  <figure>
    <svg viewBox="0 0 1420 1240" role="img" aria-label="Task 관리에서 자료 업로드로 미팅을 준비한다. 업무지원실이 희망 일정을 제안하면 비서실이 일정을 조율·확정하고, 그 결과가 캘린더 신규 일정과 브리핑으로 이어져 회장님이 텔레그램에서 일정과 토킹포인트를 확인한다. 미팅 후 자료·회의록을 추가하고 필요하면 추가 미팅 예약이나 자료 보강 루프를 돈 뒤, 보고자료가 완성되면 텔레그램 알림과 질의응답으로 이어지며, 전 과정은 회장님에게 Task 진행현황으로 상시 보고된다.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
        <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
        </marker>
      </defs>

      <!-- lane dividers -->
      <line x1="410" y1="72" x2="410" y2="1200" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5"/>
      <line x1="742" y1="72" x2="742" y2="1200" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5"/>

      <!-- lane headers -->
      <text x="220" y="34" text-anchor="middle" font-size="13" font-weight="800">보고회의 Agent · Task 관리</text>
      <text x="220" y="52" text-anchor="middle" font-size="10.5" fill="var(--ink-faint)">업무지원실 전담</text>
      <line x1="70" y1="64" x2="370" y2="64" stroke="var(--ink-faint)" stroke-width="1"/>

      <text x="576" y="34" text-anchor="middle" font-size="13" font-weight="800">일정 에이전트</text>
      <text x="576" y="52" text-anchor="middle" font-size="10.5" fill="var(--ink-faint)">캘린더 · 브리핑</text>
      <line x1="440" y1="64" x2="712" y2="64" stroke="var(--ink-faint)" stroke-width="1"/>

      <text x="920" y="34" text-anchor="middle" font-size="13" font-weight="800">텔레그램 · 회장님</text>
      <text x="920" y="52" text-anchor="middle" font-size="10.5" fill="var(--ink-faint)">브리핑 수신 · 대화형 확인</text>
      <line x1="790" y1="64" x2="1050" y2="64" stroke="var(--ink-faint)" stroke-width="1"/>

      <!-- ===== A1 Task 생성 ===== -->
      <rect x="70" y="90" width="300" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="220" y="113" text-anchor="middle" font-size="13" font-weight="700">Task 생성</text>
      <text x="220" y="131" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">업무지원실이 직접 생성</text>

      <!-- A2 자료 업로드 -->
      <line x1="220" y1="146" x2="220" y2="176" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="70" y="176" width="300" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="220" y="199" text-anchor="middle" font-size="13" font-weight="700">관련 자료 업로드</text>
      <text x="220" y="217" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">1차 미팅 준비 자료</text>

      <!-- A3 희망 일정 제안 -->
      <line x1="220" y1="232" x2="220" y2="262" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="70" y="262" width="300" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="220" y="285" text-anchor="middle" font-size="13" font-weight="700">희망 일정 제안</text>
      <text x="220" y="303" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">업무지원실, 가능한 시간대 제시</text>

      <!-- A3 -> A3b -->
      <line x1="220" y1="318" x2="220" y2="348" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
      <text x="234" y="338" font-size="9.5" fill="var(--ink-faint)">일정 조율 요청</text>

      <!-- A3b 일정 조율·확정 (비서실) -->
      <rect x="70" y="348" width="300" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="220" y="371" text-anchor="middle" font-size="13" font-weight="700">일정 조율·확정</text>
      <text x="220" y="389" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">비서실, 실제 일정 확정</text>

      <!-- A3b -> B1 -->
      <line x1="370" y1="376" x2="440" y2="376" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
      <text x="405" y="368" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">확정 일정 등록</text>

      <!-- B1 캘린더 신규 일정 -->
      <rect x="440" y="348" width="272" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="576" y="371" text-anchor="middle" font-size="13" font-weight="700">캘린더 신규 일정 생성</text>
      <text x="576" y="389" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">일정 에이전트 미니앱 반영</text>

      <!-- B1 -> B2 -->
      <line x1="576" y1="404" x2="576" y2="434" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="440" y="434" width="272" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="576" y="457" text-anchor="middle" font-size="13" font-weight="700">일간·주간 브리핑에 편입</text>
      <text x="576" y="475" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">신규 일정으로 노출</text>

      <!-- B2 -> C1 -->
      <line x1="712" y1="462" x2="790" y2="462" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
      <text x="751" y="454" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">브리핑 발송</text>

      <!-- C1 -->
      <rect x="790" y="434" width="260" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="920" y="457" text-anchor="middle" font-size="13" font-weight="700">브리핑에서 일정 확인</text>
      <text x="920" y="475" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">회장님, 일간·주간 브리핑</text>

      <!-- C1 -> C2 -->
      <line x1="920" y1="490" x2="920" y2="520" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="790" y="520" width="260" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="920" y="543" text-anchor="middle" font-size="13" font-weight="700">일정 상세 확인</text>
      <text x="920" y="561" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">AI 생성 토킹포인트·맥락</text>

      <!-- C2 -> M -->
      <path d="M920,576 L920,592 L775,592 L775,606" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>

      <!-- M 미팅 진행 (실제) -->
      <rect x="560" y="606" width="430" height="56" rx="2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4"/>
      <text x="775" y="629" text-anchor="middle" font-size="13" font-weight="700">미팅 진행</text>
      <text x="775" y="647" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">실제 회의 · 시스템 밖 이벤트</text>

      <!-- M -> A4 -->
      <path d="M620,662 L620,678 L220,678 L220,692" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>

      <!-- A4 사후 자료 추가 -->
      <rect x="70" y="692" width="300" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="220" y="715" text-anchor="middle" font-size="13" font-weight="700">지시사항 기반 자료 추가</text>
      <text x="220" y="733" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">회장님 지시·피드백 반영</text>

      <!-- A4 -> A5 -->
      <line x1="220" y1="748" x2="220" y2="778" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="70" y="778" width="300" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="220" y="801" text-anchor="middle" font-size="13" font-weight="700">회의록 등록</text>
      <text x="220" y="819" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">미팅 발언 · 결정사항 기록</text>

      <!-- A5 -> D1 -->
      <line x1="220" y1="834" x2="220" y2="853" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>

      <!-- D1 decision diamond -->
      <polygon points="220,853 335,911 220,969 105,911" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="220" y="906" text-anchor="middle" font-size="11.5" font-weight="700">추가 진행</text>
      <text x="220" y="921" text-anchor="middle" font-size="11.5" font-weight="700">필요한가?</text>

      <!-- D1 -> A3 loop (추가 미팅 예약), accent -->
      <path d="M105,911 L30,911 L30,290 L70,290" fill="none" stroke="var(--accent)" stroke-width="1.3" marker-end="url(#arrowAccent)"/>
      <rect x="-11" y="593" width="90" height="14" fill="var(--paper)" transform="rotate(-90 34 600)"/>
      <text x="34" y="600" text-anchor="middle" font-size="9.5" fill="var(--accent)" transform="rotate(-90 34 600)">추가 미팅 예약</text>

      <!-- D1 -> A4 loop (자료 보강), accent -->
      <path d="M335,911 L400,911 L400,720 L370,720" fill="none" stroke="var(--accent)" stroke-width="1.3" marker-end="url(#arrowAccent)"/>
      <rect x="369" y="809" width="70" height="14" fill="var(--paper)" transform="rotate(-90 404 816)"/>
      <text x="404" y="816" text-anchor="middle" font-size="9.5" fill="var(--accent)" transform="rotate(-90 404 816)">자료 보강</text>

      <!-- D1 -> A6 완료 -->
      <line x1="220" y1="969" x2="220" y2="1026" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
      <text x="234" y="1001" font-size="9.5" fill="var(--ink-faint)">완료</text>

      <!-- A6 보고자료 완성 -->
      <rect x="70" y="1026" width="300" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="220" y="1049" text-anchor="middle" font-size="13" font-weight="700">보고자료 완성</text>
      <text x="220" y="1067" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">Task 완료 처리</text>

      <!-- A6 -> C3 -->
      <line x1="370" y1="1054" x2="790" y2="1054" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
      <text x="580" y="1046" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">완성 알림 발송</text>

      <!-- C3 -->
      <rect x="790" y="1026" width="260" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="920" y="1049" text-anchor="middle" font-size="13" font-weight="700">텔레그램 알림 발송</text>
      <text x="920" y="1067" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">Agent, 완성 사실 전달</text>

      <!-- C3 -> C4 -->
      <line x1="920" y1="1082" x2="920" y2="1112" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="790" y="1112" width="260" height="56" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.3"/>
      <text x="920" y="1135" text-anchor="middle" font-size="13" font-weight="700">챗으로 질의 · 확인</text>
      <text x="920" y="1153" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">회장님 질문 → Agent 응답</text>

      <!-- 인물 관리 side box -->
      <rect x="1170" y="786" width="210" height="76" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 4"/>
      <text x="1275" y="812" text-anchor="middle" font-size="12.5" font-weight="700">인물 관리</text>
      <text x="1275" y="830" text-anchor="middle" font-size="10" fill="var(--ink-soft)">미팅 참석자 등록·조회</text>
      <text x="1275" y="846" text-anchor="middle" font-size="10" fill="var(--ink-faint)">Task와 무관하게 상시 접근</text>

      <!-- M -> 인물관리 dashed connector -->
      <path d="M775,662 L775,824 L1170,824" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
      <rect x="920" y="817" width="80" height="14" fill="var(--paper)"/>
      <text x="960" y="828" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">참석자 등록</text>

      <!-- Task 진행현황 종합보고 bracket -->
      <line x1="1095" y1="462" x2="1095" y2="1140" stroke="currentColor" stroke-width="1.1"/>
      <line x1="1050" y1="462" x2="1095" y2="462" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
      <line x1="1050" y1="548" x2="1095" y2="548" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
      <line x1="1050" y1="1054" x2="1095" y2="1054" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
      <line x1="1050" y1="1140" x2="1095" y2="1140" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
      <text x="1113" y="801" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink-soft)" transform="rotate(-90 1113 801)">회장님 — Task 진행현황 상시 확인 · 보고</text>

    </svg>
    <figcaption>Task 생성 → 자료 업로드로 첫 미팅을 준비합니다. 업무지원실이 희망 일정을 제안하면 비서실이 실제 일정을 조율·확정하고, 그 결과가 캘린더 등록·브리핑 발송으로 이어져 회장님이 텔레그램에서 일정과 AI 토킹포인트를 확인합니다. 미팅 후에는 지시사항 기반 자료 추가와 회의록 등록이 이어지고, 추가 미팅·자료가 필요하면 주황 화살표를 따라 각각 희망 일정 제안·자료 추가 단계로 되돌아갑니다. 보고자료가 완성되면 텔레그램 알림과 질의응답으로 마무리되며, 이 과정 전체가 회장님에게 Task 진행현황으로 상시 보고됩니다.</figcaption>
  </figure>

  <div class="legend">
    <span><i class="sw"></i>기본 흐름</span>
    <span><i class="sw acc"></i>추가 미팅·자료 보강 루프</span>
    <span><i class="sw dash"></i>실제 이벤트 · 참조 연결</span>
  </div>
</div>

</body>
</html>
