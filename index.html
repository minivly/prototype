<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK AI Agent 작업 모음 — AI 비서실 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg: #14161c;
    --bg-panel: #1c1f28;
    --bg-panel-hover: #20242f;
    --line: #2b2f3a;
    --text: #e9eaee;
    --text-dim: #8b8f9c;
    --accent: #6c63ff;
    --accent-soft: rgba(108,99,255,0.14);
    --tag-scenario: #ff9f6b;
    --tag-app: #5fd0c0;
    --tag-print: #f2c94c;
    --tag-report: #e2586b;
    --tag-process: #8b93f8;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:72px 24px 120px;
  }
  header{
    margin-bottom:48px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  h1{
    font-size:32px;
    font-weight:700;
    line-height:1.35;
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }
  header p{
    color:var(--text-dim);
    font-size:15px;
    line-height:1.6;
    margin:0;
  }

  /* ---- main grid: 5 square tiles ---- */
  .tile-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
  }
  .tile{
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:16px;
    cursor:pointer;
    text-align:center;
    padding:14px;
    color:var(--text);
    font-family:inherit;
    transition:border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .tile:hover{
    border-color:var(--accent);
    background:var(--bg-panel-hover);
    transform:translateY(-2px);
  }
  .tile:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .tile .dot{
    width:11px;height:11px;border-radius:50%;
    flex-shrink:0;
  }
  .tile .tile-label{
    font-size:14px;
    font-weight:600;
    line-height:1.4;
  }
  .tile .tile-count{
    font-size:10.5px;
    color:var(--text-dim);
    font-family:var(--mono);
  }
  .dot.scenario{background:var(--tag-scenario);}
  .dot.app{background:var(--tag-app);}
  .dot.print{background:var(--tag-print);}
  .dot.report{background:var(--tag-report);}
  .dot.process{background:var(--tag-process);}

  /* ---- detail view ---- */
  .detail-view{ display:none; }
  .detail-view.active{ display:block; }
  .tile-grid.hidden{ display:none; }

  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:'Pretendard', -apple-system, sans-serif;
    font-size:13px;
    cursor:pointer;
    padding:0;
    margin-bottom:20px;
  }
  .back-btn:hover{ color:var(--text); }

  .detail-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:19px;
    font-weight:700;
    margin-bottom:18px;
  }
  .detail-title .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  .card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:16px 18px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:10px;
    text-decoration:none;
    color:var(--text);
    transition:border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .card:hover{
    border-color:var(--accent);
    background:var(--bg-panel-hover);
    transform:translateX(2px);
  }
  .card:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .card-title{
    font-size:14.5px;
    font-weight:600;
  }
  .arrow{
    font-family:var(--mono);
    color:var(--text-dim);
    font-size:14px;
    flex-shrink:0;
    transition:transform .15s ease, color .15s ease;
  }
  .card:hover .arrow{
    color:var(--accent);
    transform:translateX(3px);
  }

  footer{
    margin-top:48px;
    padding-top:24px;
    border-top:1px solid var(--line);
    font-size:12.5px;
    color:var(--text-dim);
    font-family:var(--mono);
  }
  @media (max-width:420px){
    .tile-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce){
    .tile, .card, .arrow{ transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Prototype Index</div>
    <h1>SK AI Agent 작업 모음<br>AI 비서실 · 텔레그램 프로토타입</h1>
    <p>클로드로 만든 목업 페이지들을 한곳에 모아둔 인덱스입니다. 카드를 클릭하면 세부 링크로 이동합니다.</p>
  </header>

  <div class="tile-grid" id="tile-grid"></div>

  <div class="detail-view" id="detail-view">
    <button class="back-btn" id="back-btn">← 전체 보기</button>
    <div class="detail-title" id="detail-title"></div>
    <div id="detail-links"></div>
  </div>

  <footer id="footer-count"></footer>

  <!-- ============================================
       ▼ 새 항목 추가는 여기 배열만 수정하면 됩니다.
       key: URL 해시로 쓰이는 고유 식별자 (영문)
       dot: 색상 클래스 (scenario | app | print | report | process)
       href: 실제 github pages 파일 경로로 교체하세요
       ============================================ -->
  <script>
    const groups = [
      {
        key: "scenario",
        title: "텔레그램 시나리오",
        dot: "scenario",
        links: [
          { title: "AI 비서실 텔레그램 서비스 기획서", href: "ai-secretary-planning.html" },
          { title: "일정 에이전트 — 텔레그램 시나리오", href: "schedule-agent-telegram-scenario.html" }
        ]
      },
      {
        key: "app",
        title: "미니앱 화면",
        dot: "app",
        links: [
          { title: "TM Avatar — 구성원의 VOICE", href: "tm-avatar-voice.html" },
          { title: "일정 에이전트 — 미니앱 화면", href: "schedule-agent-miniapp-final.html" }
        ]
      },
      {
        key: "print",
        title: "프린트 화면",
        dot: "print",
        links: [
          { title: "일정 관리 — 월간·주간 달력 프린트", href: "schedule-calendar-print.html" }
        ]
      },
      {
        key: "report",
        title: "보고회의 대시보드",
        dot: "report",
        links: [
          { title: "보고회의 Agent — Admin 대시보드", href: "ReportAgent/wireframes/01_Admin_대시보드.html" }
        ]
      },
      {
        key: "process",
        title: "프로세스",
        dot: "process",
        links: [
          { title: "전체 흐름", href: "ReportAgent/diagrams/01_Task_연결_프로세스.html" },
          { title: "보고회의 Agent 흐름", href: "ReportAgent/diagrams/02_보고회의_Agent_흐름.html" }
        ]
      }
    ];

    const tileGrid = document.getElementById("tile-grid");
    const detailView = document.getElementById("detail-view");
    const detailTitle = document.getElementById("detail-title");
    const detailLinks = document.getElementById("detail-links");
    const backBtn = document.getElementById("back-btn");

    groups.forEach(group => {
      const tile = document.createElement("button");
      tile.className = "tile";
      tile.type = "button";
      tile.innerHTML = `
        <span class="dot ${group.dot}"></span>
        <span class="tile-label">${group.title}</span>
        <span class="tile-count">${group.links.length}개</span>
      `;
      tile.addEventListener("click", () => { location.hash = "/" + group.key; });
      tileGrid.appendChild(tile);
    });

    function showGrid(){
      tileGrid.classList.remove("hidden");
      detailView.classList.remove("active");
    }

    function showDetail(key){
      const group = groups.find(g => g.key === key);
      if (!group){ showGrid(); return; }
      tileGrid.classList.add("hidden");
      detailView.classList.add("active");
      detailTitle.innerHTML = `<span class="dot ${group.dot}"></span>${group.title}`;
      detailLinks.innerHTML = "";
      group.links.forEach(link => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = link.href;
        a.innerHTML = `<span class="card-title">${link.title}</span><span class="arrow">→</span>`;
        detailLinks.appendChild(a);
      });
    }

    backBtn.addEventListener("click", () => { location.hash = ""; });

    function route(){
      const hash = location.hash.replace(/^#\/?/, "");
      if (hash) showDetail(hash);
      else showGrid();
    }
    window.addEventListener("hashchange", route);
    route();

    const total = groups.reduce((n, g) => n + g.links.length, 0);
    document.getElementById("footer-count").textContent =
      `${groups.length}개 카테고리 · 총 ${total}개 페이지 · 각 파일을 같은 저장소에 push하면 링크가 바로 연결됩니다`;
  </script>

</div>
</body>
</html>
