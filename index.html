<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>첫 테스트 페이지</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      max-width: 420px;
    }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { font-size: 15px; color: #6e6e73; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 14px;
      background: #eef4ff;
      color: #3b6fd6;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 세팅 완료!</h1>
    <p>이 페이지는 Claude와 대화해서 만든 뒤,<br>로컬 저장소 폴더에 저장된 테스트 파일입니다.</p>
    <p>GitHub Desktop에서 이 변경 사항을 commit &amp; push 하면<br>흐름이 완성됩니다.</p>
    <span class="badge">index.html · test build</span>
  </div>
</body>
</html>
